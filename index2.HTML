<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Date diff</title>
</head>
<body>
    <input type="date" id="date1">
    <input type="date" id="date2">
    <input type="button" id="submit" value="Calcular">
    <p id="result"></p>
    <script>
        const date1 = document.querySelector('input#date1');
        const date2 = document.querySelector('input#date2');
        const submit = document.querySelector('input#submit');
        const result = document.querySelector('p#result');

        submit.onclick = () => {
            const dayDiff = Math.abs(new Date(date2.value).get - new Date(date1.value)) / 86_400_000.;
            result.innerHTML = `${dayDiff} dias`;
        };

    </script>
</body>
</html>
