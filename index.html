<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timer</title>
</head>
<body>
    <h1 id="time"></h1>
    <script>
        const time = document.querySelector('h1#time');
        const date = new Date();
        const day = date.getDay();
        const hour = date.getHours();

        if (hour >= 9 && hour < 14 && day !== 0 && day !== 6) {
            document.writeln('Bienvenido');
        } else {
            document.writeln('Página cerrada');
        }

        function updateTimer() {
            const date = new Date();
            time.innerHTML = date.toLocaleTimeString();

            setTimeout(updateTimer, 1000);
        }

        updateTimer();
    </script>
</body>
</html>
